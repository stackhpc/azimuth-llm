{{- if .Values.ui.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-omni-ui
  labels:
    {{- include "azimuth-omni.labels" . | nindent 4 }}
spec:
  ports:
  - name: ui
    port: 80
    protocol: TCP
    targetPort: ui
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "azimuth-omni.ui-selectorLabels" . | nindent 4 }}
{{- end -}}
